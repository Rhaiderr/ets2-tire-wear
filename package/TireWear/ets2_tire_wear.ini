; ets2_tire_wear settings (alpha release defaults: worn tires on, tests off)
[present]
; 1 = after the world loads, locate the system DXGI Present and log it
probe = 1
; 1 = also detour Present (count frames); needs probe = 1
hook = 1
; 1 = draw the wear HUD from the Present detour; needs hook = 1
overlay = 0
; HUD font scale and top-left position in pixels
overlay_scale = 1.6
overlay_x = 20
overlay_y = 20
; seconds to wait after the first unpaused frame
delay_s = 10
[tires]
; 1 = hook early (at plugin load) and recognise the tire textures; needs hook = 1
log = 1
; 1 = write a capture of tire draws, capture_delay_s after the first unpaused frame (diagnosis)
capture = 0
capture_delay_s = 30
; second capture (0 = none), e.g. while driving
capture2_delay_s = 0
; consecutive frames per capture (1-60); more than 1 also logs what the separation saw
capture_frames = 1
; 1 = draw tires worn according to the telemetry wear; needs log = 1
wear_levels = 1
; number of wear levels (level 0 = the game's own texture)
levels = 8
; test only: 0.0 ... 1.0 forces this wear on every tire; -1 = use the telemetry
wear_override = -1
; test only: 1 = worn tire colour painted magenta
tint_test = 0
; 1 = only the player's truck and trailers wear (traffic keeps the game's tires)
separate = 1
